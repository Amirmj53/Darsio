<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت حساب | درسیو</title>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --hero-base: #04050c;
            --heading: #eef0f6;
            --body-muted: #b9becf;
            --glass-fill: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.16);
            --action-inverse: #ffffff;
            --action-inverse-fg: #2f2f33;
        }
        * { margin: 0; box-sizing: border-box; }
        body {
            font-family: "Onest", sans-serif;
            background: var(--hero-base);
            color: var(--heading);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            width: 100%;
            max-width: 26rem;
            background: var(--glass-fill);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-weight: 500;
            font-size: 1.35rem;
            margin-bottom: 2rem;
            color: var(--heading);
            text-decoration: none;
        }
        .logo svg { width: 1.5rem; height: 1.5rem; }
        h1 { font-size: 1.6rem; font-weight: 500; text-align: center; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: var(--body-muted); font-size: 0.95rem; margin-bottom: 2rem; }
        .field { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.875rem; color: var(--body-muted); margin-bottom: 0.4rem; }
        input {
            width: 100%;
            height: 3.1rem;
            padding: 0 1rem;
            border-radius: 0.9rem;
            border: 1px solid var(--glass-border);
            background: rgba(4,5,12,0.5);
            color: var(--heading);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: rgba(255,255,255,0.35); }
        .error {
            background: rgba(220,80,80,0.15);
            border: 1px solid rgba(220,80,80,0.3);
            color: #f5a8a8;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }
        .submit {
            width: 100%;
            height: 3.1rem;
            border-radius: 9999px;
            background: var(--action-inverse);
            color: var(--action-inverse-fg);
            font-weight: 500;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            margin-top: 0.75rem;
            transition: background 0.15s;
        }
        .submit:hover { background: rgba(255,255,255,0.88); }
        .switch {
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.9rem;
            color: var(--body-muted);
        }
        .switch a { color: var(--heading); font-weight: 500; text-decoration: none; }
        .back {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: var(--body-muted);
            text-decoration: none;
        }
        .hint { font-size: 0.78rem; color: var(--body-muted); margin-top: 0.35rem; }

        /* Password Strength */
        .strength-wrap {
            margin-top: 0.75rem;
        }
        .strength-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--body-muted);
            margin-bottom: 0.4rem;
        }
        .strength-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 99px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            transition: width 0.4s ease, background 0.4s ease;
        }
        .strength-fill.weak { background: #f87171; }
        .strength-fill.medium { background: #fbbf24; }
        .strength-fill.strong { background: #34d399; }
    </style>
</head>
<body>
    <div class="card">
        <a href="/" class="logo">
            <svg viewBox="0 0 24 24" fill="none"><path d="M2.5 9c2.5 0 2.5 4.2 5 4.2S10 9 12 9s2.5 4.2 5 4.2S19.5 9 21.5 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M2.5 15c2.5 0 2.5 4.2 5 4.2S10 15 12 15s2.5 4.2 5 4.2S19.5 15 21.5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/></svg>
            <span>درسیو</span>
        </a>

        <h1>ساخت حساب</h1>
        <p class="subtitle">شروع مطالعه هوشمند</p>

        <form action="/auth/register/form" method="post" id="register-form">
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <div class="field">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" name="username" placeholder="your_username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_.-]{3,30}" autocomplete="username">
                <div class="hint">۳ تا ۳۰ کاراکتر، فقط حروف انگلیسی و عدد</div>
            </div>

            <div class="field">
                <label for="email">ایمیل</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>

            <div class="field">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="حداقل ۸ کاراکتر" required minlength="8" autocomplete="new-password">
                
                <div class="strength-wrap">
                    <div class="strength-header">
                        <span>قدرت رمز عبور</span>
                        <span id="strength-text">—</span>
                    </div>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strength-fill"></div>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit">ساخت حساب</button>
        </form>

        <div class="switch">
            قبلاً حساب داری؟ <a href="/auth/login">ورود</a>
        </div>
        <a href="/" class="back">بازگشت به صفحه اصلی</a>
    </div>

    <script>
        const passwordInput = document.getElementById("password");
        const strengthFill = document.getElementById("strength-fill");
        const strengthText = document.getElementById("strength-text");

        passwordInput.addEventListener("input", () => {
            const val = passwordInput.value;
            let score = 0;

            if (val.length >= 8) score++;
            if (val.length >= 12) score++;
            if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^a-zA-Z0-9]/.test(val)) score++;

            // Reset classes
            strengthFill.className = "strength-fill";

            if (val.length === 0) {
                strengthFill.style.width = "0%";
                strengthText.textContent = "—";
            } else if (score <= 2) {
                strengthFill.style.width = "33%";
                strengthFill.classList.add("weak");
                strengthText.textContent = "ضعیف";
            } else if (score <= 3) {
                strengthFill.style.width = "66%";
                strengthFill.classList.add("medium");
                strengthText.textContent = "متوسط";
            } else {
                strengthFill.style.width = "100%";
                strengthFill.classList.add("strong");
                strengthText.textContent = "قوی";
            }
        });
    </script>
</body>
</html>
