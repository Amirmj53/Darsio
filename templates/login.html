<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | درسیو</title>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/auth.css?v=5">
</head>
<body>
    <div class="auth-bg" aria-hidden="true">
        <div class="stars" id="stars"></div>
    </div>

    <main class="auth-shell">
        <div class="auth-card">
            <a href="/" class="auth-brand">
                <span class="logo-mark">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M2.5 9c2.5 0 2.5 4.2 5 4.2S10 9 12 9s2.5 4.2 5 4.2S19.5 9 21.5 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M2.5 15c2.5 0 2.5 4.2 5 4.2S10 15 12 15s2.5 4.2 5 4.2S19.5 15 21.5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
                    </svg>
                </span>
                <span>درسیو</span>
            </a>

            <h1 class="auth-title">ورود</h1>
            <p class="auth-sub">با ایمیل و رمز وارد حسابت شو.</p>

            {% if auth_error %}
            <div class="auth-error" role="alert">{{ auth_error }}</div>
            {% endif %}

            <form action="/auth/login/form" method="post" novalidate>
                <div class="field">
                    <label for="email">ایمیل</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">رمز عبور</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <div class="step-actions">
                    <button type="submit" class="btn-primary">ورود</button>
                </div>
            </form>

            <p class="auth-footer">
                حساب نداری؟
                <a href="/auth/register">ثبت‌نام</a>
            </p>
            <p class="auth-footer">
                <a href="/">بازگشت به صفحه اصلی</a>
            </p>
        </div>
    </main>

    <script src="/static/auth.js?v=5" defer></script>
</body>
</html>
